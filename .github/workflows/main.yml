name: Actualizar datos económicos

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Chrome (necesario para 3 de los indicadores)
        uses: browser-actions/setup-chrome@v1
        with:
          chromedriver: "true"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Recolectar datos oficiales (BCU / INE / MEF)
        run: python collect_data.py

      - name: Guardar los datos nuevos en el repositorio
        run: |
          git config user.name "Actualizador automatico"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No hay datos nuevos para guardar."
            exit 0
          fi
          git commit -m "Actualizacion automatica de datos"
          for intento in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Datos guardados correctamente."
              exit 0
            fi
            echo "El repositorio cambio mientras trabajabamos. Reintento $intento de 3..."
            git pull --rebase origin main || git rebase --abort || true
          done
          echo "No se pudieron guardar los datos despues de 3 intentos."
          exit 1
